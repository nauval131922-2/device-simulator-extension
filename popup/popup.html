<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Simulator Control</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <div class="header">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
      <h2>Device Simulator</h2>
    </div>
    
    <p class="subtitle">Test current page in mobile, tablet & laptop view</p>

    <div class="actions">
      <button id="openCurrentTabBtn" class="btn btn-primary">
        🚀 Open Current Tab in Simulator
      </button>

      <button id="openBlankBtn" class="btn btn-secondary">
        🌐 Open Blank Simulator
      </button>
    </div>

    <div class="footer">
      <span>Version 1.0.0</span>
      <span>V3 Manifest</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
